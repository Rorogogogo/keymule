[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# Linux builds are static (musl), so they run in any container, Alpine included.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The Homebrew tap the formula is published to
tap = "Rorogogogo/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Record where each download was built (GitHub artifact attestations)
github-attestations = true
# Build every download on pull requests too (kept on the run, not released)
pr-run-mode = "upload"
