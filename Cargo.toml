[package]
name = "keymule"
version = "0.9.1"
edition = "2024"
rust-version = "1.89"
description = "Let AI coding agents use your API tokens and passwords without ever seeing them"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rorogogogo/keymule"
readme = "README.md"
keywords = ["mcp", "claude-code", "secrets", "credentials", "cli"]
categories = ["command-line-utilities", "development-tools", "authentication"]
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-*"]

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
keyring = "4.2.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.9.0", features = ["server", "transport-io"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
toml = "1.2.1"
toml_edit = "0.25.19"

[dev-dependencies]
tempfile = "3.27.0"
