<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
/* keymule's dialog, in the same calm style as `keymule ui`. */
:root {
  --bg: #ffffff;
  --foot: #f7f8fa;
  --ink: #1a1f36;
  --ink2: #596171;
  --ink3: #8792a2;
  --line: #ebeef1;
  --line2: #d5dbe1;
  --code: #f7f8fa;
  --accent: #635bff;
  --accent-hover: #5851ea;
  --accent-soft: rgb(99 91 255 / 0.10);
  --warn: #c84801;
  --warn-soft: rgb(252 165 0 / 0.16);
  --bad: #df1b41;
  --bad-hover: #c8173a;
  --bad-soft: rgb(223 27 65 / 0.10);
  --btn: #ffffff;
  --btn-hover: #f7f8fa;
  --btn-shadow: 0 1px 1px rgb(0 0 0 / 0.06), 0 0 0 1px rgb(26 31 54 / 0.10);
  --ring: 0 0 0 3px rgb(99 91 255 / 0.28);
  --sans: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #202020;
    --foot: #1b1b1b;
    --ink: #ededed;
    --ink2: #a3a3a3;
    --ink3: #767676;
    --line: #2e2e2e;
    --line2: #3d3d3d;
    --code: #181818;
    --accent: #7a73ff;
    --accent-hover: #8a84ff;
    --accent-soft: rgb(122 115 255 / 0.16);
    --warn: #f5b759;
    --warn-soft: rgb(240 170 40 / 0.14);
    --bad: #ff6b8b;
    --bad-hover: #ff819c;
    --bad-soft: rgb(240 70 110 / 0.16);
    --btn: #2b2b2b;
    --btn-hover: #333333;
    --btn-shadow: 0 0 0 1px rgb(255 255 255 / 0.09);
    --ring: 0 0 0 3px rgb(122 115 255 / 0.35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body {
  font: 13px/1.5 var(--sans);
  color: var(--ink2);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  cursor: default;
  overflow: hidden;
}
.brand {
  display: flex; align-items: center; gap: 6px;
  padding: 14px 20px 0;
  font-size: 11.5px; font-weight: 500; color: var(--ink3);
  letter-spacing: 0.01em;
}
.brand svg { width: 13px; height: 13px; }
.main { display: flex; gap: 14px; padding: 14px 20px 20px; }
.icon {
  flex: none; width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.icon svg { width: 20px; height: 20px; }
.warn .icon { background: var(--warn-soft); color: var(--warn); }
.bad .icon { background: var(--bad-soft); color: var(--bad); }
.text { min-width: 0; flex: 1; padding-top: 1px; }
h1 {
  margin: 0 0 6px; font-size: 14.5px; line-height: 1.4; font-weight: 600;
  color: var(--ink); overflow-wrap: anywhere;
}
p { margin: 0 0 8px; overflow-wrap: anywhere; }
pre {
  margin: 2px 0 10px; padding: 8px 10px;
  font: 12px/1.5 var(--mono); color: var(--ink);
  background: var(--code); border: 1px solid var(--line); border-radius: 6px;
  white-space: pre-wrap; word-break: break-all;
  -webkit-user-select: text; cursor: text;
}
.label { margin: 4px 0 4px; font-size: 12px; font-weight: 500; color: var(--ink3); }
.text > :last-child { margin-bottom: 0; }
input {
  display: block; width: 100%; height: 34px; margin-top: 12px; padding: 0 10px;
  font: 13px var(--mono); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line2); border-radius: 6px;
  outline: none;
}
input::placeholder { font-family: var(--sans); color: var(--ink3); }
input:focus { border-color: var(--accent); box-shadow: var(--ring); }
.foot {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 12px 20px; background: var(--foot); border-top: 1px solid var(--line);
}
.foot .spacer { flex: 1; }
button {
  height: 30px; padding: 0 12px; border: 0; border-radius: 6px;
  font: 500 13px var(--sans); color: var(--ink);
  background: var(--btn); box-shadow: var(--btn-shadow);
  white-space: nowrap; outline: none;
}
button:hover { background: var(--btn-hover); }
button:focus-visible { box-shadow: var(--btn-shadow), var(--ring); }
button.primary { color: #fff; background: var(--accent); box-shadow: 0 1px 1px rgb(0 0 0 / 0.12); }
button.primary:hover { background: var(--accent-hover); }
button.danger { color: #fff; background: var(--bad); box-shadow: 0 1px 1px rgb(0 0 0 / 0.12); }
button.danger:hover { background: var(--bad-hover); }
button.primary:focus-visible, button.danger:focus-visible { box-shadow: var(--ring); }
</style>
</head>
<body>
<div class="brand">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
  keymule
</div>
<div class="main" id="main">
  <div class="icon" id="icon"></div>
  <div class="text" id="text"></div>
</div>
<div class="foot" id="foot"></div>
<script>
// The spec is put in place of the null below, as JSON (see dialog.js).
const SPEC = /*SPEC*/null;

const ICONS = {
  key: '<path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/>',
  unlock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
  eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
};

function post(msg) {
  window.webkit.messageHandlers.keymule.postMessage(JSON.stringify(msg));
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

const s = SPEC;
document.body.className = s.tone || '';
document.getElementById('icon').innerHTML =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  (ICONS[s.icon] || ICONS.key) + '</svg>';

// Text: the headline, then paragraphs; lines indented by 8 spaces are code,
// and a short paragraph ending in ":" right before code is its label.
const text = document.getElementById('text');
text.appendChild(el('h1', null, s.title));
const paras = (s.body || '').split(/\n\n+/).filter(p => p.trim() !== '');
paras.forEach((p, i) => {
  const lines = p.split('\n');
  if (lines.every(l => l.startsWith('        '))) {
    text.appendChild(el('pre', null, lines.map(l => l.slice(8)).join('\n')));
    return;
  }
  const next = paras[i + 1];
  const beforeCode = next && next.split('\n').every(l => l.startsWith('        '));
  const short = p.length < 60 && !p.includes('\n');
  text.appendChild(el('p', beforeCode && short ? 'label' : null, p));
});

let field = null;
if (s.secure) {
  field = el('input');
  field.type = 'password';
  field.placeholder = 'Paste or type it here';
  field.autocomplete = 'off';
  field.spellcheck = false;
  text.appendChild(field);
}

let done = false;
function choose(label) {
  if (done) return;
  done = true;
  const out = { button: label };
  if (field) out.text = field.value;
  post(out);
}

// Buttons, left to right. The cancel button sits apart on the left when
// there are three; the primary one is filled.
const foot = document.getElementById('foot');
const buttons = {};
s.buttons.forEach((label, i) => {
  const b = el('button', null, label);
  if (label === s.destructive) b.className = 'danger';
  else if (label === s.primary) b.className = 'primary';
  b.onclick = () => choose(label);
  buttons[label] = b;
  foot.appendChild(b);
  if (i === 0 && s.buttons.length > 2) foot.appendChild(el('span', 'spacer'));
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); choose(s.cancel); }
  else if (e.key === 'Enter' && document.activeElement === field) {
    e.preventDefault(); choose(s.default);
  }
});

// Focus: the text field, else the default button (Return presses it).
window.addEventListener('load', () => {
  if (field) field.focus();
  else if (buttons[s.default]) buttons[s.default].focus();
  post({ height: Math.ceil(document.documentElement.getBoundingClientRect().height) });
});
</script>
</body>
</html>
